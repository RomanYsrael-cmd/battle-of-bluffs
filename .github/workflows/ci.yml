name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test backend
        working-directory: backend
        run: ./mvnw test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: battle_of_bluffs
          POSTGRES_USER: battle_user
          POSTGRES_PASSWORD: development_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U battle_user -d battle_of_bluffs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.30.4
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck:e2e
      - name: Start backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/battle_of_bluffs
          DB_USERNAME: battle_user
          DB_PASSWORD: development_password
          FRONTEND_URL: http://127.0.0.1:5173
          MAIL_HOST: localhost
          MAIL_PORT: 1025
          LOGIN_RATE_LIMIT: 100
          REGISTER_RATE_LIMIT: 100
        run: |
          ./mvnw spring-boot:run > ../backend-e2e.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8080/actuator/health/liveness && exit 0
            sleep 2
          done
          tail -n 200 ../backend-e2e.log
          exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > ../frontend-e2e.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5173 && exit 0
            sleep 1
          done
          tail -n 100 ../frontend-e2e.log
          exit 1
      - name: Run Playwright platform flows
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          if-no-files-found: ignore
          path: |
            frontend/test-results/
            frontend/playwright-report/
            backend-e2e.log
            frontend-e2e.log
