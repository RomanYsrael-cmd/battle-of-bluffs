name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  # Push and pull_request runs for the same branch must not bootstrap separate
  # vulnerability databases concurrently from GitHub-hosted runners.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan complete Git history for secrets
        run: gitleaks git --redact --verbose --exit-code 1 .

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test backend
        working-directory: backend
        run: ./mvnw test
      - name: Analyze dependency declarations
        working-directory: backend
        run: ./mvnw dependency:analyze
      - name: Restore OWASP vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-12.2.2-
      - name: Update OWASP vulnerability database
        working-directory: backend
        env:
          ODC_DATA_DIRECTORY: ${{ runner.temp }}/dependency-check-data
        run: |
          for attempt in 1 2; do
            if ./mvnw org.owasp:dependency-check-maven:12.2.2:update-only \
              -DdataDirectory="$ODC_DATA_DIRECTORY" \
              -DnvdDatafeedUrl='https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz'; then
              exit 0
            fi

            if [ "$attempt" -eq 2 ]; then
              echo "OWASP vulnerability database update failed after $attempt attempts" >&2
              exit 1
            fi

            echo "OWASP vulnerability database update failed; purging the partial database before one retry" >&2
            ./mvnw org.owasp:dependency-check-maven:12.2.2:purge \
              -DdataDirectory="$ODC_DATA_DIRECTORY"
            sleep 90
          done
      - name: Scan backend dependencies
        working-directory: backend
        env:
          ODC_DATA_DIRECTORY: ${{ runner.temp }}/dependency-check-data
        run: >-
          ./mvnw org.owasp:dependency-check-maven:12.2.2:check
          -DdataDirectory="$ODC_DATA_DIRECTORY"
          -DautoUpdate=false
          -DskipTestScope=true
          -DfailBuildOnCVSS=7
      - name: Package backend artifact
        working-directory: backend
        run: ./mvnw -DskipTests package
      - name: Upload backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/target/battle-of-bluffs-backend-*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Generate backend SBOM
        working-directory: backend
        run: ./mvnw -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom
      - name: Upload backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sbom
          path: backend/target/bom.*
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Generate frontend SBOM
        working-directory: frontend
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --omit dev --output-file frontend-bom.json
      - name: Upload frontend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-sbom
          path: frontend/frontend-bom.json
          retention-days: 14

  end-to-end:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: battle_of_bluffs
          POSTGRES_USER: battle_user
          POSTGRES_PASSWORD: development_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U battle_user -d battle_of_bluffs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.30.4
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck:e2e
      - name: Start backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/battle_of_bluffs
          DB_USERNAME: battle_user
          DB_PASSWORD: development_password
          FRONTEND_URL: http://127.0.0.1:5173
          MAIL_HOST: localhost
          MAIL_PORT: 1025
          LOGIN_RATE_LIMIT: 100
          REGISTER_RATE_LIMIT: 100
        run: |
          ./mvnw spring-boot:run > ../backend-e2e.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8080/actuator/health/liveness && exit 0
            sleep 2
          done
          tail -n 200 ../backend-e2e.log
          exit 1
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > ../frontend-e2e.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:5173 && exit 0
            sleep 1
          done
          tail -n 100 ../frontend-e2e.log
          exit 1
      - name: Run Playwright platform flows
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/test-results/
            frontend/playwright-report/
            backend-e2e.log
            frontend-e2e.log
