name: Deploy backend production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, linux, x64, gotg-production]
    concurrency:
      group: gotg-production-backend
      cancel-in-progress: false
    steps:
      - name: Inspect the exact successful commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Determine whether backend deployment is required
        id: changes
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git diff --name-only "${DEPLOY_SHA}^" "$DEPLOY_SHA" | grep -Eq '^(backend/|ops/gotg-deploy-backend$)'; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'backend=false' >> "$GITHUB_OUTPUT"
            echo 'No backend or backend deployment-script changes; production backend restart is intentionally skipped.'
          fi
      - name: Download exact CI backend artifact
        if: steps.changes.outputs.backend == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-jar-${{ github.event.workflow_run.head_sha }}
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Deploy exact successful commit
        if: steps.changes.outputs.backend == 'true'
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          jar_path=$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)
          test -n "$jar_path"
          sudo /usr/local/bin/gotg-deploy-backend "$jar_path" "$DEPLOY_SHA"
